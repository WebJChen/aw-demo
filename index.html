  <script>
    // GitHub Pages：History 模式仍可部署。
    // 1) 旧 Hash 书签 /aw-demo/#/wine/... -> /aw-demo/wine/...
    // 2) 刷新 404：/aw-demo/?/wine/... -> /aw-demo/wine/...
    (function () {
      var l = window.location;
      var repoBase = "/aw-demo/";
      if (l.hash && l.hash.indexOf("#/") === 0) {
        var body = l.hash.slice(1);
        var qi = body.indexOf("?");
        var hp = qi >= 0 ? body.slice(0, qi) : body;
        var hq = qi >= 0 ? body.slice(qi) : "";
        window.history.replaceState(null, "", repoBase.replace(/\/$/, "") + hp + (hq || l.search || ""));
        l = window.location;
      }
      if (l.search[1] === "/") {
        var decoded = l.search.slice(1).replace(/~and~/g, "&");
        var prefix = l.pathname.endsWith("/") ? l.pathname.slice(0, -1) : l.pathname;
        window.history.replaceState(null, "", prefix + decoded);
      }
    })();
  </script>
