<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Redirecting...</title>
  <script>
    // GitHub Pages SPA fallback（必须是 ?/path，不能是 ?path）：
    // /aw-demo/winery/tasmania/wineries/key -> /aw-demo/?/winery/tasmania/wineries/key
    (function () {
      var l = window.location;
      var repoBase = "/aw-demo/";
      var path = l.pathname || "/";
      var rest = path.indexOf(repoBase) === 0
        ? path.slice(repoBase.length)
        : path.replace(/^\//, "");
      var target =
        repoBase +
        "?/" +
        rest.replace(/&/g, "~and~") +
        (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
        l.hash;
      l.replace(target);
    })();
  </script>
</head>

<body></body>

</html>
